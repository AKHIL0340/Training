<!DOCTYPE html>
<html>
    <head>
    <link rel="stylesheet" href="psdcls.css"/>
    <title>Pseudo Class Selectors</title>
    </head>
    <body>
        <h3>Pseudo Class Selectors</h3>
        <ol>
            <li value="Hover">:Hover</li>
            <li value="Focus">:Focus</li>
            <li value="first-child">:first-child</li>
            <li value="last-child">:last-child</li>
            <li value="n-th child">:nth-child</li>
            <li value="active">:Active</li>
            <li value="visited">:Visited</li>
            <li value="check">:Checked</li>
            <li value="enable" class="notselect">:Enabled</li>
            <li value="disable">:Disabled</li>
            <li value="not">:not</li>
        </ol>
        <p>
            Now in this we are gonna perform diff types of 
            PseudoClass Selectors 
        </p>
    </body>
</html>
